name: Deploy to Mistral
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install Mistral CLI
        run: curl -fsSL https://mistral.ai/cli/install.sh | bash
      - name: Deploy
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          export PATH="$HOME/.mistral/bin:$PATH"
          for i in 1 2 3 4; do
            if mistral deploy --yes; then exit 0; fi
            echo "Tentative $i/4 echouee, nouvelle tentative dans 90 s..."
            sleep 90
          done
          echo "Echec du deploy apres 4 tentatives."
          exit 1
